worker_processes 1;
pid nginx.pid;
error_log stderr;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path client_temp;
    proxy_temp_path proxy_temp;
    upstream testing_api { server 127.0.0.1:3030; }
    server {
        listen 127.0.0.1:43080;
        server_name _;
        port_in_redirect off;
        location = /auth/google/callback {
            proxy_pass http://testing_api;
        }
        location = /backend/api/gmail/setup-sync {
            proxy_read_timeout 11m;
            proxy_pass http://testing_api/api/gmail/setup-sync;
        }
        location ^~ /backend/api/gmail/reviews {
            client_max_body_size 12m;
            proxy_read_timeout 120s;
            proxy_pass http://testing_api/api/gmail/reviews;
        }
        location ^~ /backend/ {
            proxy_pass http://testing_api/;
        }
        location / {
            proxy_pass http://127.0.0.1:43000;
            proxy_set_header Host localhost:43000;
        }
    }
}
